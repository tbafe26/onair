# 허용 목록에 값을 추가하기 전에 사용자에게 확인한다(AGENTS.md "필수 규칙").

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "사설 IPv4 주소"
regex = '''\b(?:10\.(?:\d{1,3}\.){2}\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
keywords = ["10.", "192.168.", "172."]

[[rules]]
id = "local-user-path"
description = "사용자 이름이 드러나는 로컬 경로"
regex = '''(?i)(?:[a-z]:[\\/]+users[\\/]+|/home/|/Users/)[a-z0-9._-]+'''
keywords = ["users", "/home/"]

  [[rules.allowlists]]
  regexes = ['''(?i)(?:users[\\/]+|/home/|/Users/)(?:me|username|<[^>]+>|\$\{?[a-z_]+\}?)(?:[\\/]|$)''']
