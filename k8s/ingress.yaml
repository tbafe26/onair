# K3s 기본 입구(Traefik).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onair
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /hls
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # WHIP 송출(/live/{방송 id}/whip)은 미디어 서버로.
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: mediamtx
                port:
                  number: 8889
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
