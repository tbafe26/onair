apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.7-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: onair
            - name: POSTGRES_USER
              value: onair
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onair-db
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "onair", "-d", "onair"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
