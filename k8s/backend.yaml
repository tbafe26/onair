apiVersion: v1
kind: ConfigMap
metadata:
  name: onair-backend
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onair
  SPRING_DATASOURCE_USERNAME: onair
  STORAGE_DIR: /data/videos
  # 미디어 서버(mediamtx.yaml)가 같은 볼륨의 hls 폴더에 쓴다.
  HLS_DIR: /data/videos/hls
  # 채팅 WebSocket이 받아들일 화면 주소. 클러스터 입구를 이 PC의 8088 포트로 연다.
  ALLOWED_ORIGINS: http://localhost:8088
  # JVM은 기본으로 컨테이너 메모리의 1/4만 힙으로 쓴다. 나머지는 메타스페이스·스레드 몫으로 남긴다.
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
---
# 업로드 영상과 썸네일. 노드가 1대라 모든 백엔드 파드가 같은 볼륨을 마운트한다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: videos
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # 파드 수는 HPA(hpa.yaml)가 정한다. 여기에 적으면 kubectl apply 때마다 그 값으로 되돌아간다.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: onair-backend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: onair-backend
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onair-db
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # 기동이 끝날 때까지는 liveness로 재시작하지 않는다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          volumeMounts:
            - name: videos
              mountPath: /data/videos
      volumes:
        - name: videos
          persistentVolumeClaim:
            claimName: videos
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8080
