# 개발용 의존 서비스. bootRun을 하면 Spring Boot가 이 파일의 컨테이너를 띄우고 DB 연결 정보를 자동으로 잡는다.
# 비밀번호는 git에서 제외한 backend/.env의 POSTGRES_PASSWORD에서 읽는다(Docker Compose가 같은 폴더의 .env를 읽음).
services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: onair
      POSTGRES_USER: onair
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?backend/.env에 POSTGRES_PASSWORD를 넣으세요}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - onair-postgres:/var/lib/postgresql

  # 라이브 송출을 WHIP으로 받아 HLS 조각을 HLS_DIR에 쓴다. 백엔드가 그 폴더를 /hls/로 내준다.
  mediamtx:
    image: bluenviron/mediamtx:1.21.4
    environment:
      MTX_RTSP: "no"
      MTX_RTMP: "no"
      MTX_SRT: "no"
      # 시청자는 미디어 서버가 아니라 백엔드에서 파일을 받으므로, 요청이 없어도 HLS 조각을 계속 쓴다.
      MTX_HLSALWAYSREMUX: "yes"
      MTX_HLSVARIANT: fmp4
      MTX_HLSSEGMENTDURATION: 1s
      MTX_HLSDIRECTORY: /hls
      # 송출 키 확인은 백엔드에 묻는다.
      MTX_AUTHMETHOD: http
      MTX_AUTHHTTPADDRESS: http://host.docker.internal:8080/internal/media/auth
      # 브라우저가 컨테이너 내부 주소 대신 이 PC의 포트로 영상을 보내게 한다.
      MTX_WEBRTCADDITIONALHOSTS: 127.0.0.1
      # 연결 뒤 첫 영상 패킷이 2초(기본값) 넘게 걸리면 송출을 끊는다. Docker를 거친 UDP에서 3초 걸린 적이 있어 늘린다.
      MTX_WEBRTCTRACKGATHERTIMEOUT: 10s
      # 백엔드가 5초마다 송출 목록을 읽고, 소유자가 종료하면 송출을 끊는다.
      # 송출 키 확인(위의 http 인증)에서 제어 API는 빼므로, API 포트는 이 PC에만 연다.
      MTX_API: "yes"
      MTX_AUTHHTTPEXCLUDE_0_ACTION: api
    # Docker Desktop이 아닌 Linux Docker에서도 host.docker.internal이 이 PC를 가리키게 한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8189:8189/udp"
      - "127.0.0.1:9997:9997"
    volumes:
      - ${HLS_DIR:-~/.onair/hls}:/hls

volumes:
  onair-postgres:
