# 테스트는 H2 메모리 모드를 쓴다. 컨텍스트마다 DB 이름이 달라 서로 간섭하지 않는다.
spring.datasource.generate-unique-name=true
spring.jpa.hibernate.ddl-auto=create-drop
# 업로드 상한은 운영 기본값과 같게 둔다. 상한 테스트는 DynamicPropertySource로 낮춘다.
# 멀티파트 상한은 MultipartConfig가 이 값에서 계산한다.
app.upload.max-size=200MB
spring.mvc.problemdetails.enabled=true
# 영상 저장 폴더는 모든 테스트가 같은 경로를 쓴다. 경로가 같아야 Spring 컨텍스트를 재사용한다.
# 테스트마다 비우는 일은 ApiTestSupport가 한다.
app.storage.dir=build/test-storage
# 운영 설정과 같게 둔다(테스트에서는 main의 application.properties 대신 이 파일을 읽는다).
spring.jpa.open-in-view=false

# 운영 설정과 같게 둔다(목록의 영상 건별 조회 방지).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# 운영 설정과 같게 둔다(시그널링 WebSocket의 허용 Origin).
app.signal.allowed-origins=https://*:5173
