server.port=8080

# backend/.env가 있으면 읽는다(없어도 된다). 예시는 backend/.env.example.
spring.config.import=optional:file:.env[.properties]

# H2 파일 모드. 위치는 환경변수 H2_DB_PATH로 바꾼다(기본: 저장소 밖 홈 폴더의 .onair/db/).
spring.datasource.url=jdbc:h2:file:${H2_DB_PATH:${user.home}/.onair/db/onair}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 영상·썸네일 저장 폴더. 환경변수 STORAGE_DIR로 바꾼다(기본: 저장소 밖 홈 폴더의 .onair/videos).
app.storage.dir=${STORAGE_DIR:${user.home}/.onair/videos}
# 업로드 크기 상한(영상 파일 하나). 환경변수 MAX_UPLOAD_SIZE로 바꾼다(기본 200MB).
# 멀티파트 파일 상한은 같은 값이고, 요청 전체 상한은 여기에 썸네일 2MB와 여유 1MB를 더한다(MultipartConfig).
app.upload.max-size=${MAX_UPLOAD_SIZE:200MB}
spring.mvc.problemdetails.enabled=true

# 지연 로딩 연관(녹화방송의 영상)을 목록에서 건별 조회하지 않고 묶어서 읽는다.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# 시그널링 WebSocket이 받아들일 Origin 패턴(쉼표로 구분). 환경변수 ALLOWED_ORIGINS로 바꾼다.
# Vite 개발 서버 프록시를 거치면 Origin은 개발 서버 주소(HTTPS 5173, pnpm dev:local은 HTTP 5174)이고 Host는 8080이라 따로 허용한다.
app.signal.allowed-origins=${ALLOWED_ORIGINS:https://*:5173,http://localhost:5174}

# 한 라이브방송의 동시 시청자 상한. 환경변수 MAX_LIVE_VIEWERS로 바꾼다(기본 5).
app.live.max-viewers=${MAX_LIVE_VIEWERS:5}

# 세션 쿠키는 스크립트가 읽지 못하게 하고, 다른 사이트에서 시작한 요청에는 싣지 않는다. 세션 만료는 기본값(30분 동안 요청이 없으면)을 쓴다.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
